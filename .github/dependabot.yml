# Keeps the pins current: Python dependencies in uv.lock, the GitHub Actions pinned by
# commit, and the base images pinned by digest. Each week's updates come as one pull
# request per ecosystem; CI runs the tests on it before anything is published.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  # Digest updates only for Python: a new minor version is a decision (Barkley needs
  # 3.13), not a weekly bump.
  - package-ecosystem: docker
    directories: [/docker, /docker/egress]
    schedule: { interval: weekly }
    groups:
      images: { patterns: ["*"] }
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]

  # Never a new Postgres major version: it can't open the old one's data directory.
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]
