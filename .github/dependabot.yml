# Keeps the pins current: Python dependencies in uv.lock, the scanners' in
# docker/tools/*/uv.lock, the GitHub Actions pinned by commit, and the base images pinned
# by digest. Each week's updates come as one pull
# request per group below; CI runs the tests on it before anything is published.
# Each waits a week after its release (cooldown): a hijacked or broken release is
# usually found and pulled by then. uv's exclude-newer does the same for the locks.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      python: { patterns: ["*"] }

  # The scanners and everything they need (docker/tools/<name>/uv.lock). A new scanner
  # version can find more, or less: the pull request shows which one moved.
  - package-ecosystem: uv
    directories: ["/docker/tools/*"]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      scanners: { patterns: ["*"] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }

  # Digest updates only for Python: a new minor version is a decision (Barkley needs
  # 3.13), not a weekly bump.
  - package-ecosystem: docker
    directories: [/docker, /docker/egress]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      images: { patterns: ["*"] }
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]

  # Never a new Postgres major version: it can't open the old one's data directory.
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]
