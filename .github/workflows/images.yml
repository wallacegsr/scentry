# Builds the three images (amd64 and arm64), signs them, and publishes them to the
# GitHub Container Registry, so the stack can be deployed without building (Portainer
# can't build through its agent).
#   push to main  -> :latest and :sha-<commit>
#   tag vX.Y.Z    -> :X.Y.Z and :X.Y
# Pull requests run the tests only.
name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Images are published only when the tests pass, on Postgres as deployed: whatever
  # reaches :latest may be pulled by an auto-updater and migrate a real database.
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci  # a throwaway database inside the job
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci" --health-interval 5s --health-retries 10
    env:
      SCENTRY_TEST_POSTGRES: postgresql+psycopg://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      # From uv.lock, hashes checked; --locked fails if the lock is out of date.
      - run: uv sync --locked --extra dev --python python3.13
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pytest -q -rs

  # amd64 and arm64 under one tag. Each image is signed with cosign, keyless: the
  # signature is bound to this workflow's GitHub identity, so there's no key to leak.
  # It also gets a build provenance attestation (which commit and workflow made it).
  build:
    name: ${{ matrix.image }}
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write       # the identity cosign and the attestation are bound to
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: web, context: ., file: docker/Dockerfile, target: web }
          - { image: runner, context: ., file: docker/Dockerfile, target: runner }
          - { image: egress, context: docker/egress, file: docker/egress/Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/scentry-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # No build cache: a cache shared between runs could be poisoned, and these
      # images are what scans hostile code.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      # By digest, so the signature covers exactly what was pushed, whatever its tags.
      - name: Sign
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/scentry-${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes --recursive "${IMAGE}@${DIGEST}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/scentry-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
