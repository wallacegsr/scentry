# Barkley (published as ha-sniff-test), for docker/Dockerfile. It isn't on PyPI: built
# from its repository at an exact commit (v0.14.0), with the build backend from uv.lock.
# Python 3.14, which Barkley needs: the image has it beside the 3.13 everything else uses.
[project]
name = "scentry-tool-barkley"
version = "0"
requires-python = "==3.14.*"
dependencies = [
    "ha-sniff-test @ git+https://github.com/SeriesOfTubez/ha-barkley@cb17f5fdaa674b294520bfaa4c3c100869cb9a4c",
    "hatchling>=1.25",  # its build backend: locked here, not fetched at build time
]

[tool.uv]
package = false
# Only releases at least a week old (a hijacked one is usually pulled by then).
exclude-newer = "7 days"
# Linux only, and wheels for both image architectures must exist.
environments = ["sys_platform == 'linux'"]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
# Built inside its own environment, with the locked hatchling, not an isolated one.
no-build-isolation-package = ["ha-sniff-test"]
