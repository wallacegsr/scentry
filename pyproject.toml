[project]
name = "scentry"
version = "0.1.0"
description = "Self-hosted code security scanning portal for your own repositories and Home Assistant integrations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "websockets>=15",
    "apprise>=1.9",
    "alembic>=1.14",
    "anthropic>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.8"]

[project.scripts]
scentry = "scentry.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scentry"]

[tool.uv]
# Only releases at least a week old (a hijacked one is usually pulled by then).
exclude-newer = "7 days"
# Except the Anthropic SDK: the AI explanations use API features only its newest has.
exclude-newer-package = { anthropic = false }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
    "S603",  # subprocess without shell: fixed scanner binaries, list args
    "S607",  # tool binaries are resolved on PATH
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
